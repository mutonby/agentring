name: Release

# Cut a release by pushing a tag: git tag v0.2.0 && git push origin v0.2.0
# (see docs/release.md for the secrets and settings this needs).
#
# Builds the signed APK, the daemon sdist + wheel and the relay/daemon images, then
# publishes the images to GHCR, the daemon to PyPI (trusted publishing) and a GitHub
# release with the APK, the Python packages and SHA256SUMS. Nothing is published
# unless every build succeeded.
#
# Actions are pinned by commit SHA (comment = release tag); bump them deliberately.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version from the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Parse the tag and check it matches daemon/pyproject.toml
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # vX.Y.Z or vX.Y.Z{a,b,rc}N: valid PEP 440 (PyPI) and a fine Android versionName.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)((a|b|rc)([0-9]+))?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z{a,b,rc}N"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          kind=${BASH_REMATCH[5]} n=${BASH_REMATCH[6]:-0}
          if (( minor > 99 || patch > 99 || n > 29 )); then
            echo "::error::minor/patch must be <= 99 and the pre-release number <= 29"; exit 1
          fi
          # Android versionCode: MMMmmpp + a 2-digit slot so a1 < b1 < rc1 < final.
          case "$kind" in a) slot=$n ;; b) slot=$((30 + n)) ;; rc) slot=$((60 + n)) ;; *) slot=99 ;; esac
          version=${TAG#v}
          version_code=$(( major * 1000000 + minor * 10000 + patch * 100 + slot ))
          prerelease=$([[ -n "$kind" ]] && echo true || echo false)

          pyproject=$(python3 -c 'import tomllib; print(tomllib.load(open("daemon/pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$pyproject" != "$version" ]]; then
            echo "::error::daemon/pyproject.toml has version $pyproject, the tag says $version. Bump it (and uv lock) first."; exit 1
          fi
          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (versionCode $version_code, prerelease $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Signed release APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Release builds start clean: no cache entry from another branch can leak in.
          cache-disabled: true

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGENTRING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret AGENTRING_KEYSTORE_BASE64 is not set (docs/release.md)"; exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AGENTRING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build (core tests + release APK)
        working-directory: app-android
        env:
          AGENTRING_REQUIRE_RELEASE_KEY: "1"
          AGENTRING_KEYSTORE_PASSWORD: ${{ secrets.AGENTRING_KEYSTORE_PASSWORD }}
          AGENTRING_KEY_ALIAS: ${{ secrets.AGENTRING_KEY_ALIAS }}
          AGENTRING_KEY_PASSWORD: ${{ secrets.AGENTRING_KEY_PASSWORD }}
        run: |
          # The GitHub APK includes Android Auto; Play bundles don't (docs/android-auto.md).
          ./gradlew --stacktrace :core:test :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$VERSION_CODE" -PagentringAndroidAuto=true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check signer and version
        env:
          # Optional repository variable: the release certificate's SHA-256 (lowercase hex,
          # no colons) as printed by apksigner. When set, any other signer fails the release.
          EXPECTED_CERT_SHA256: ${{ vars.AGENTRING_RELEASE_CERT_SHA256 }}
        run: |
          apk=app-android/app/build/outputs/apk/release/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"; exit 1
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" ]] && ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK signer is not the expected release certificate"; exit 1
          fi
          "$bt/aapt2" dump badging "$apk" | head -1 | tee /dev/stderr \
            | grep -q "versionCode='$VERSION_CODE' versionName='$VERSION'"
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q "androidx.car.app.category.CALLING" \
            || { echo "::error::The APK has no Android Auto entry point"; exit 1; }
          mkdir -p out && cp "$apk" "out/agentring-$VERSION.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: out/agentring-${{ needs.meta.outputs.version }}.apk
          if-no-files-found: error

  python:
    name: Daemon sdist + wheel
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Build
        working-directory: daemon
        run: uv build --build-constraints build-constraints.txt --out-dir dist
      - name: The wheel reports the tag's version
        working-directory: daemon
        run: |
          ls -l dist
          uv venv -q --python 3.12 "$RUNNER_TEMP/check"
          uv pip install -q --python "$RUNNER_TEMP/check" --no-deps dist/*.whl
          got=$("$RUNNER_TEMP/check/bin/python" -c 'import agentring; print(agentring.__version__)')
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error::agentring.__version__ is $got, expected $VERSION"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: daemon/dist/
          if-no-files-found: error

  images:
    name: Image ${{ matrix.component }} (GHCR)
    needs: [meta, android, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [relay, daemon]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentring-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=agentring-${{ matrix.component }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  pypi:
    name: Publish to PyPI
    needs: [meta, android, python, images]
    # Off until trusted publishing is set up on pypi.org (docs/release.md, step 3):
    # then set the repository variable AGENTRING_PUBLISH_PYPI=true.
    if: vars.AGENTRING_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agentring/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: no PyPI token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [meta, android, python, images, pypi]
    # Every build must have succeeded; PyPI may have been skipped (see the pypi job).
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.android.result == 'success' &&
      needs.python.result == 'success' && needs.images.result == 'success' &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      OWNER: ${{ github.repository_owner }}
      ON_PYPI: ${{ needs.pypi.result == 'success' }}
    steps:
      # Only what the release ships: the run also holds Docker's build records
      # (*.dockerbuild), which download-artifact cannot fetch.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
          path: assets/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: assets/
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          owner=${OWNER,,}
          if [[ "$ON_PYPI" == true ]]; then
            daemon="\`uv tool install 'agentring[voice]==$VERSION'\` (or \`pipx install 'agentring[voice]==$VERSION'\`)."
          else
            daemon="download \`agentring-$VERSION-py3-none-any.whl\` below, then \`uv tool install './agentring-$VERSION-py3-none-any.whl[voice]'\`."
          fi
          cat > notes.md <<EOF
          ## Install

          - **Android**: \`agentring-$VERSION.apk\` below (allow installs from unknown sources).
            Signed with the agentring release key: it does not install over the debug-signed
            \`android-preview\` build; uninstall that one first.
          - **Daemon / CLI**: $daemon
          - **Relay**: \`ghcr.io/$owner/agentring-relay:$VERSION\`
          - **Daemon image**: \`ghcr.io/$owner/agentring-daemon:$VERSION\`

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" assets/* --verify-tag --title "agentring $VERSION" \
            --notes-file notes.md --generate-notes "${flags[@]}"
