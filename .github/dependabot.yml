# Weekly, grouped updates. `cooldown` skips releases younger than 14 days, the same
# age rule we follow by hand (CONTRIBUTING.md). Check the lockfiles against
# OSV before merging. Major versions are bumped by hand (security updates still come).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
    groups: {actions: {patterns: ["*"]}}

  - package-ecosystem: npm
    directory: /relay
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
    groups: {relay: {patterns: ["*"]}}

  - package-ecosystem: uv
    directory: /daemon
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
    groups: {daemon: {patterns: ["*"]}}

  - package-ecosystem: gradle
    directory: /app-android
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    # androidx.core >= 1.17 needs a newer compileSdk / AGP than the app uses; bump those by hand first.
    ignore:
      - {dependency-name: "*", update-types: ["version-update:semver-major"]}
      - {dependency-name: "androidx.core:core-ktx", versions: [">= 1.17"]}
    groups: {android: {patterns: ["*"]}}

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
